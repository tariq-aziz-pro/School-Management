{% extends 'main_app/base.html' %}
{% block title %}Login - School System{% endblock %}
{% load crispy_forms_tags %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-5">
            <div class="card shadow-sm border-0 rounded-3">
                <div class="card-body p-4 p-md-5">
                    <h1 class="h4 fw-bold mb-1 text-center">Sign in</h1>
                    <p class="text-muted small text-center mb-4">School management portal</p>

                    <form method="post" action="{% url 'login' %}" novalidate>
                        {% csrf_token %}
                        {{ form|crispy }}
                        <button type="submit" class="btn btn-primary w-100 py-2 mt-2">Login</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
