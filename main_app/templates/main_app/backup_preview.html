{% extends 'main_app/base.html' %}
{% block content %}
<div class="container mt-4">
    <h4>📄 Preview School Data Backup</h4>
    <p class="text-muted">Session: <strong>{{ active_session.session_name }}</strong></p>
    <p class="text-muted">Format: <strong>{{ format|title }}</strong></p>

    {% for model_name, table_html in preview_data.items %}
        <div class="mt-4">
            <h5>{{ model_name }}</h5>
            {{ table_html|safe }}
        </div>
    {% endfor %}

    <form method="post" action="{% url 'download_backup' %}">
        {% csrf_token %}
        <input type="hidden" name="format" value="{{ format }}">
        <input type="hidden" name="session" value="{{ active_session.id }}">
        <button class="btn btn-success mt-4">⬇️ Download Full Backup</button>
    </form>
</div>
{% endblock %}
