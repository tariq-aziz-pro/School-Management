{% extends 'main_app/base.html' %}
{% load crispy_forms_tags %}
{% block content %}
<div class="container mt-4">
    <h2>Confirm Delete</h2>
    <p>Are you sure you want to delete <strong>{{ transport.vehicle_number }}</strong> (Driver: {{ transport.driver_name }})?</p>
    <form method="post" class="form">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Delete</button>
        <a href="{% url 'transport_list' %}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
