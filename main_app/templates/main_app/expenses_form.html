{% extends 'main_app/base.html' %}
{% load crispy_forms_tags %}
{% block content %}
<div class="container mt-4">
    <h2>{{ title }}</h2>
    <form method="post" class="form" id="expenseForm">
        {% csrf_token %}
        {{ form|crispy }}
        <button type="submit" class="btn btn-primary">Save</button>
        <a href="{% url 'expenses_list' %}" class="btn btn-secondary">Cancel</a>
    </form>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const expenseTypeField = document.querySelector('#id_expense_type');
    const expenseNameField = document.querySelector('#id_expense_name');
    const periodLabel = document.querySelector('label[for="id_period"]');
    const periodField = document.querySelector('#id_period');

    const monthlyChoices = [
        {% for name, _ in form.fields.expense_name.choices %}
            {% if name not in 'Stationary,Food' %}'{{ name }}',{% endif %}
        {% endfor %}
    ];
    const dailyChoices = ['Stationary', 'Food'];

    function updateFormFields() {
        const expenseType = expenseTypeField.value;
        // Update expense_name choices
        expenseNameField.innerHTML = '';
        const choices = expenseType === 'Daily' ? dailyChoices : monthlyChoices;
        choices.forEach(choice => {
            const option = document.createElement('option');
            option.value = choice;
            option.text = choice;
            if (choice === '{{ form.expense_name.value|default_if_none:"" }}') {
                option.selected = true;
            }
            expenseNameField.appendChild(option);
        });
        // Update period label and placeholder
        if (expenseType === 'Daily') {
            periodLabel.textContent = 'Day Name';
            periodField.placeholder = 'e.g., Monday';
        } else {
            periodLabel.textContent = 'Month Name';
            periodField.placeholder = 'e.g., January';
        }
    }

    // Initial setup
    updateFormFields();
    // Update on change
    expenseTypeField.addEventListener('change', updateFormFields);
});
</script>
{% endblock %}
