{% load ui_tags %}
{% if messages %}
<div class="toast-container position-fixed top-0 end-0 p-3 app-message-stack" style="z-index: 1100; margin-top: 4.5rem; max-width: 22rem;">
    {% for message in messages %}
        <div class="alert alert-{{ message.tags|message_bootstrap_class }} alert-dismissible fade show shadow-sm app-dismissible-msg mb-2" role="alert">
            {{ message }}
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
    {% endfor %}
</div>
{% endif %}
